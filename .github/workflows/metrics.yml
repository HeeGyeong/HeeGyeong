name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

jobs:
  profile-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 상단 GitHub Stats + Top Langs (기존 Anurag's stats / Top Langs 대체)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          committer_branch: metrics
          base: "header"
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15

      # 저장소별 Readme Card 대체 (Repository pin card)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.composesample.svg
          committer_branch: metrics
          template: repository
          repo: HeeGyeong/ComposeSample

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.cleanarchitecturesample.svg
          committer_branch: metrics
          template: repository
          repo: HeeGyeong/CleanArchitectureSample

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.modulearchitecture.svg
          committer_branch: metrics
          template: repository
          repo: HeeGyeong/ModuleArchitecture

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.algorithmexample.svg
          committer_branch: metrics
          template: repository
          repo: HeeGyeong/AlgorithmExample
